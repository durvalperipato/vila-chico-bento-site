name: vila_chico_bento_site
description: "Vila Chico Bento - Creche e Hospedagem para Cães em Pinhais/PR"
publish_to: 'none'

version: 0.0.1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  nano_core: ^1.0.7
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^11.0.0
  firebase_core: ^4.15.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
