<body style="margin: 0; padding: 0; background-color: #FAF6EE; overflow: hidden;">
  <!-- Splash Screen Nativa de Inicialização -->
  <div id="vcb-splash" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #FAF6EE;
    z-index: 999999;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    transition: opacity 0.4s ease-out;
  ">
    <style>
      @keyframes vcb-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.85; }
      }
      @keyframes vcb-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      .vcb-paw {
        width: 64px;
        height: 64px;
        margin-bottom: 20px;
        animation: vcb-pulse 1.8s ease-in-out infinite;
      }
      .vcb-progress-container {
        width: 160px;
        height: 4px;
        background-color: rgba(255, 140, 66, 0.2);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin-top: 16px;
      }
      .vcb-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 60px;
        height: 100%;
        background-color: #FF8C42;
        border-radius: 999px;
        animation: vcb-bar 1.5s ease-in-out infinite;
      }
    </style>

    <!-- Ícone de Patinha em SVG puro -->
    <svg class="vcb-paw" viewBox="0 0 24 24" fill="#FF8C42">
      <path d="M12 11.5c1.38 0 2.5-1.12 2.5-2.5s-1.12-2.5-2.5-2.5-2.5 1.12-2.5 2.5 1.12 2.5 2.5 2.5zm-5.5-2c1.38 0 2.5-1.12 2.5-2.5S7.88 4.5 6.5 4.5 4 5.62 4 7s1.12 2.5 2.5 2.5zm11 0c1.38 0 2.5-1.12 2.5-2.5S18.88 4.5 17.5 4.5 15 5.62 15 7s1.12 2.5 2.5 2.5zm-5.5 4c-2.48 0-4.5 2.02-4.5 4.5 0 .83.67 1.5 1.5 1.5h6c.83 0 1.5-.67 1.5-1.5 0-2.48-2.02-4.5-4.5-4.5z"/>

    <div style="font-size: 20px; font-weight: 700; color: #2C3E50; letter-spacing: -0.5px;">

    <div style="font-size: 13px; color: #7F8C8D; margin-top: 4px;">

    <!-- Barra de carregamento suave -->
    <div class="vcb-progress-container">
      <div class="vcb-progress-bar"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove a splash screen suavemente assim que o primeiro frame do Flutter é desenhado
    window.addEventListener('flutter-first-frame', function() {
      const splash = document.getElementById('vcb-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 400);
      }
    });
  </script>
